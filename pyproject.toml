[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-digest-baseline"
version = "0.1.0"
description = "Локальный детерминированный baseline, без оценки качества на реальных данных"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.11,<2", "build>=1.2,<2"]

[project.scripts]
cloud-digest = "cloud_digest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
files = ["src"]
